name: EAS Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_platform:
        description: Platform to build
        required: false
        default: android
        type: choice
        options:
          - android
          - ios

permissions:
  contents: read

jobs:
  eas-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.build_platform) || '["android","ios"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.EAS_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: 16.16.1
          token: ${{ secrets.EAS_TOKEN }}

      - name: Run EAS build
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.EAS_TOKEN != ''
        run: eas build --platform "${{ matrix.platform }}" --non-interactive
