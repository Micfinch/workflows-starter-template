name: EAS Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_platform:
        description: Platform to build
        required: false
        default: android
        type: choice
        options:
          - android
          - ios

permissions:
  contents: read

jobs:
  eas-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 16.16.1
          token: ${{ secrets.EAS_TOKEN }}

      - name: Run EAS build
        env:
          BUILD_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.build_platform || 'android' }}
        run: eas build --platform "${BUILD_PLATFORM}" --non-interactive
